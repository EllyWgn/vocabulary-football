<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Football</title>
<style>
:root{--blue:#1859a9;--red:#c92d3a;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#102c19;color:#fff}body{display:flex;flex-direction:column;min-height:100vh;padding:clamp(10px,2vw,26px);gap:clamp(10px,1.5vw,18px)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.team{border-radius:18px;padding:10px 18px;text-align:center;color:white;box-shadow:0 5px 18px #0004}.team.a{background:var(--blue)}.team.b{background:var(--red)}.team .name{font-weight:800;font-size:clamp(16px,2vw,26px);letter-spacing:.04em}.team .score{font-size:clamp(32px,5vw,58px);font-weight:900;line-height:1.1}.middle{font-weight:800;font-size:clamp(13px,1.5vw,19px);text-align:center;color:#e8f4e8}
.pitch-wrap{flex:1;min-height:280px;display:flex;align-items:stretch}.pitch{position:relative;width:100%;min-height:300px;overflow:hidden;border:5px solid #fff;border-radius:8px;background:repeating-linear-gradient(90deg,#16802d 0,#16802d 12.5%,#1b8c34 12.5%,#1b8c34 25%);box-shadow:0 10px 35px #0006}.half{position:absolute;top:0;bottom:0;left:50%;border-left:4px solid #ffffffd9}.circle{position:absolute;width:min(28%,260px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #ffffffd9;border-radius:50%}.center-dot{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:white;transform:translate(-50%,-50%)}.boxarea{position:absolute;top:23%;height:54%;width:12%;border:4px solid #ffffffd9}.boxarea.left{left:-1px;border-left:0}.boxarea.right{right:-1px;border-right:0}.goal{position:absolute;top:38%;height:24%;width:3.5%;border:4px solid white;background:#ffffff20;box-shadow:inset 0 0 0 2px #ffffff50}.goal.left{left:-3.5%;border-left:0}.goal.right{right:-3.5%;border-right:0}.team-label{position:absolute;top:5%;font-size:clamp(13px,1.7vw,22px);font-weight:900;padding:7px 14px;border-radius:12px;background:#ffffffed}.team-label.left{left:3%;color:var(--blue)}.team-label.right{right:3%;color:var(--red)}
.track{position:absolute;left:7%;right:7%;top:50%;height:7px;background:#ffffffd9;transform:translateY(-50%);border-radius:99px}.markers{position:absolute;left:7%;right:7%;top:50%;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none}.marker{width:clamp(22px,3.4vw,44px);aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid #e5e5e5;box-shadow:0 3px 8px #0004}.ball{position:absolute;top:50%;left:50%;width:clamp(36px,5.4vw,68px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:clamp(32px,5vw,62px);filter:drop-shadow(0 4px 4px #0008);transition:left .42s cubic-bezier(.2,.8,.2,1);z-index:3;pointer-events:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls button,.utility button{border:0;border-radius:14px;padding:14px 18px;font-size:clamp(15px,1.7vw,21px);font-weight:800;color:white;cursor:pointer;box-shadow:0 4px 12px #0004;transition:transform .08s,filter .15s}.controls button:active,.utility button:active{transform:translateY(2px)}.advance-a{background:var(--blue)}.advance-b{background:var(--red)}.utility{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.utility button{background:#ffffff20;border:1px solid #ffffff80;font-size:14px;padding:10px 16px}.status{text-align:center;font-weight:700;min-height:1.4em;color:#efffee;font-size:clamp(14px,1.6vw,19px)}button:focus-visible{outline:4px solid #ffdf59;outline-offset:3px}
@media(max-width:560px){body{padding:8px}.scoreboard{gap:6px}.team{padding:8px}.pitch{min-height:280px}.controls button{padding:12px 8px}.circle{width:34%}}
@media (min-aspect-ratio:16/9){.pitch-wrap{max-height:calc(100vh - 230px)}}
</style>
</head>
<body>
<header class="scoreboard" aria-label="Scoreboard">
 <section class="team a"><div class="name">TEAM A</div><div class="score" id="scoreA">0</div></section>
 <div class="middle">SCORE</div>
 <section class="team b"><div class="name">TEAM B</div><div class="score" id="scoreB">0</div></section>
</header>
<main class="pitch-wrap"><section class="pitch" aria-label="Football pitch">
 <div class="half"></div><div class="circle"></div><div class="center-dot"></div>
 <div class="boxarea left"></div><div class="boxarea right"></div><div class="goal left"></div><div class="goal right"></div>
 <div class="team-label left">TEAM A</div><div class="team-label right">TEAM B</div>
 <div class="track"></div><div class="markers" aria-hidden="true"><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i><i class="marker"></i></div>
 <div class="ball" id="ball" aria-label="Ball">⚽</div>
 </section></main>
<div class="status" id="status" aria-live="polite">Kick-off – the ball is in the centre.</div>
<section class="controls"><button class="advance-a" id="moveA">⚽ Team A – correct answer</button><button class="advance-b" id="moveB">⚽ Team B – correct answer</button></section>
<nav class="utility"><button id="undo">↶ Undo last move</button><button id="reset">New game</button><button id="fullscreen">⛶ Full screen</button></nav>
<script>
(()=>{
 const ball=document.getElementById('ball'),status=document.getElementById('status'),scoreAEl=document.getElementById('scoreA'),scoreBEl=document.getElementById('scoreB');
 let position=4,scoreA=0,scoreB=0,history=[];
 const snapshot=()=>history.push({position,scoreA,scoreB,message:status.textContent});
 function render(){ball.style.left=(7+position*10.75)+'%';scoreAEl.textContent=scoreA;scoreBEl.textContent=scoreB}
 function move(team){snapshot();if(team==='A'){if(position===8){scoreA++;position=4;status.textContent='GOAL for Team A! Kick-off from the centre.'}else{position++;status.textContent='Team A moves forward!'}}else{if(position===0){scoreB++;position=4;status.textContent='GOAL for Team B! Kick-off from the centre.'}else{position--;status.textContent='Team B moves forward!'}}render()}
 document.getElementById('moveA').addEventListener('click',()=>move('A'));document.getElementById('moveB').addEventListener('click',()=>move('B'));
 document.getElementById('undo').addEventListener('click',()=>{const prev=history.pop();if(!prev){status.textContent='There is no move to undo yet.';return}({position,scoreA,scoreB}=prev);status.textContent=prev.message;render()});
 document.getElementById('reset').addEventListener('click',()=>{position=4;scoreA=0;scoreB=0;history=[];status.textContent='New game – Anstoß in der Mitte.';render()});
 document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){status.textContent='Full-screen mode is not available in this browser.'}});
 document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move('A');if(e.key==='ArrowRight')move('B');if(e.key.toLowerCase()==='r')document.getElementById('reset').click()});render();
})();
</script>
</body></html>
